[package]
name = "research-minion"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "An offline research logbook for the desktop"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:eframe"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
thiserror = "2.0.18"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "research-minion"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
