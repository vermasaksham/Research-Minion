[package]
name = "crystal-forge"
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
description = "Crystal-growth experiments and scientific utilities"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:egui_commonmark"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11"] }
egui_commonmark = { version = "0.22.0", optional = true, default-features = false, features = ["pulldown_cmark"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
thiserror = "2.0.18"
uuid = { version = "1.29.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15.4", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "crystal-forge"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
